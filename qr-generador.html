<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Carta - PARCHE IBARNA</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#0a0a0f,#111827);
    }

    .container{
      width:100%;
      max-width:620px;
      background:rgba(15,23,42,.96);
      border:1px solid rgba(0,255,255,.2);
      border-radius:28px;
      padding:35px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }

    .logo{
      font-size:34px;
      font-weight:800;
      color:#fff;
      margin-bottom:8px;
    }

    .logo span{
      color:#00ffff;
      font-weight:300;
    }

    .subtitle{
      color:#9fb3c8;
      margin-bottom:25px;
      font-size:14px;
    }

    .input-group{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:15px;
    }

    .input-group input{
      flex:1;
      min-width:240px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#0f172a;
      color:white;
      outline:none;
      font-size:14px;
    }

    .input-group button{
      padding:14px 22px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      background:linear-gradient(95deg,#00ffff,#6effff);
    }

    .preview{
      background:#0f172a;
      color:#8ca5ba;
      padding:12px;
      border-radius:10px;
      font-size:12px;
      word-break:break-all;
      margin-bottom:25px;
    }

    .qr-box{
      background:white;
      border-radius:24px;
      padding:30px;
      display:inline-block;
      margin-bottom:25px;
      box-shadow:0 0 30px rgba(0,255,255,.2);
    }

    #qrCode svg{
      width:320px;
      height:320px;
      display:block;
    }

    .buttons{
      display:flex;
      gap:15px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn{
      padding:14px 24px;
      border:none;
      border-radius:40px;
      cursor:pointer;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:8px;
      transition:.3s;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn-primary{
      background:linear-gradient(95deg,#00ffff,#6effff);
      color:black;
    }

    .btn-outline{
      background:transparent;
      color:#6effff;
      border:1px solid rgba(0,255,255,.3);
    }

    .message{
      margin-top:20px;
      padding:12px;
      border-radius:10px;
      display:none;
      font-size:13px;
    }

    @media(max-width:600px){
      .input-group{
        flex-direction:column;
      }

      .buttons{
        flex-direction:column;
      }

      .btn{
        justify-content:center;
      }

      #qrCode svg{
        width:260px;
        height:260px;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="logo">PARCHE <span>IBARNA</span></div>
  <div class="subtitle">Generador QR Carta Digital</div>

  <div class="input-group">
    <input
      id="urlInput"
      type="text"
      value="https://cjleyva.github.io/parche-ibarna/menu.html"
      placeholder="Ingresa la URL">
    <button onclick="generateQR()">Actualizar</button>
  </div>

  <div class="preview" id="urlPreview"></div>

  <div class="qr-box">
    <div id="qrCode"></div>
  </div>

  <div class="buttons">
    <button class="btn btn-primary" onclick="downloadPNG()">
      <i class="fa-solid fa-download"></i>
      Descargar PNG
    </button>

    <button class="btn btn-outline" onclick="downloadSVG()">
      <i class="fa-solid fa-file"></i>
      Descargar SVG
    </button>

    <button class="btn btn-outline" onclick="copyURL()">
      <i class="fa-solid fa-copy"></i>
      Copiar URL
    </button>
  </div>

  <div class="message" id="message"></div>

</div>

<!-- Librería QR moderna -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>

<script>
let currentURL = "";

function showMessage(text, ok = true){
  const msg = document.getElementById("message");
  msg.style.display = "block";
  msg.innerHTML = text;
  msg.style.background = ok
    ? "rgba(0,255,100,.15)"
    : "rgba(255,0,0,.15)";
  msg.style.color = ok ? "#9cffb0" : "#ffb1b1";
  msg.style.border = ok
    ? "1px solid rgba(0,255,100,.3)"
    : "1px solid rgba(255,0,0,.3)";

  setTimeout(()=>{
    msg.style.display = "none";
  },2500);
}

function generateQR(){
  let url = document.getElementById("urlInput").value.trim();

  if(!url){
    showMessage("❌ Ingresa una URL", false);
    return;
  }

  if(!url.startsWith("http://") && !url.startsWith("https://")){
    url = "https://" + url;
  }

  currentURL = url;
  document.getElementById("urlPreview").textContent = url;

  const qr = qrcode(0, "M");
  qr.addData(url);
  qr.make();

  const svgTag = qr.createSvgTag({
    scalable: true,
    margin: 4
  });

  document.getElementById("qrCode").innerHTML = svgTag;

  showMessage("✅ QR SVG generado correctamente");
}

function downloadSVG(){
  const svg = document.querySelector("#qrCode svg");

  if(!svg){
    showMessage("❌ No hay QR", false);
    return;
  }

  const data = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([data], {type:"image/svg+xml"});
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "parche-ibarna-qr.svg";
  a.click();

  URL.revokeObjectURL(url);

  showMessage("📥 SVG descargado");
}

function downloadPNG(){
  const svg = document.querySelector("#qrCode svg");

  if(!svg){
    showMessage("❌ No hay QR", false);
    return;
  }

  const data = new XMLSerializer().serializeToString(svg);
  const svgBlob = new Blob([data], {type:"image/svg+xml"});
  const url = URL.createObjectURL(svgBlob);

  const img = new Image();

  img.onload = function(){
    const canvas = document.createElement("canvas");
    canvas.width = 1200;
    canvas.height = 1200;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,1200,1200);

    const png = canvas.toDataURL("image/png");

    const a = document.createElement("a");
    a.href = png;
    a.download = "parche-ibarna-qr.png";
    a.click();

    URL.revokeObjectURL(url);

    showMessage("📥 PNG HD descargado");
  };

  img.src = url;
}

async function copyURL(){
  await navigator.clipboard.writeText(currentURL);
  showMessage("📋 URL copiada");
}

generateQR();
</script>

</body>
</html>
