<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador QR - PARCHE IBARNA</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#0a0a0f,#111827);
    }

    .container{
      width:100%;
      max-width:600px;
      background:rgba(15,23,42,.95);
      border:1px solid rgba(0,255,255,.2);
      border-radius:28px;
      padding:35px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.4);
    }

    .logo{
      font-size:34px;
      font-weight:800;
      color:white;
      margin-bottom:8px;
    }

    .logo span{
      color:#00ffff;
      font-weight:300;
    }

    .subtitle{
      color:#9fb3c8;
      margin-bottom:28px;
      font-size:14px;
    }

    .input-group{
      display:flex;
      gap:10px;
      margin-bottom:18px;
      flex-wrap:wrap;
    }

    .input-group input{
      flex:1;
      min-width:240px;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#0f172a;
      color:white;
      outline:none;
      font-size:14px;
    }

    .input-group button{
      padding:14px 22px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-weight:bold;
      background:linear-gradient(95deg,#00ffff,#6effff);
    }

    .preview{
      background:#0f172a;
      color:#8ca5ba;
      padding:12px;
      border-radius:10px;
      font-size:12px;
      word-break:break-all;
      margin-bottom:25px;
    }

    .qr-box{
      background:white;
      border-radius:24px;
      padding:22px;
      display:inline-block;
      box-shadow:0 0 30px rgba(0,255,255,.2);
      margin-bottom:25px;
    }

    .qr-box img{
      width:320px;
      max-width:100%;
      display:block;
      border-radius:12px;
    }

    .buttons{
      display:flex;
      gap:15px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn{
      padding:14px 24px;
      border:none;
      border-radius:40px;
      cursor:pointer;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:8px;
      transition:.3s;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn-primary{
      background:linear-gradient(95deg,#00ffff,#6effff);
      color:black;
    }

    .btn-outline{
      background:transparent;
      color:#6effff;
      border:1px solid rgba(0,255,255,.3);
    }

    .message{
      margin-top:20px;
      padding:12px;
      border-radius:10px;
      display:none;
      font-size:13px;
    }

    @media(max-width:600px){
      .input-group{
        flex-direction:column;
      }

      .buttons{
        flex-direction:column;
      }

      .btn{
        justify-content:center;
      }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="logo">PARCHE <span>IBARNA</span></div>
  <div class="subtitle">Generador de código QR para carta digital</div>

  <div class="input-group">
    <input
      id="urlInput"
      type="text"
      value="https://cjleyva.github.io/parche-ibarna/menu.html"
      placeholder="Ingresa la URL">
    <button onclick="generateQR()">Actualizar</button>
  </div>

  <div class="preview" id="urlPreview"></div>

  <div class="qr-box">
    <img id="qrImage" alt="Código QR">
  </div>

  <div class="buttons">
    <button class="btn btn-primary" onclick="downloadQR()">
      <i class="fa-solid fa-download"></i>
      Descargar QR
    </button>

    <button class="btn btn-outline" onclick="copyURL()">
      <i class="fa-solid fa-copy"></i>
      Copiar URL
    </button>

    <button class="btn btn-outline" onclick="printQR()">
      <i class="fa-solid fa-print"></i>
      Imprimir
    </button>
  </div>

  <div class="message" id="message"></div>

</div>

<script>
let currentURL = "";

function showMessage(text, ok=true){
  const msg = document.getElementById("message");
  msg.style.display = "block";
  msg.innerHTML = text;
  msg.style.background = ok
    ? "rgba(0,255,100,.15)"
    : "rgba(255,0,0,.15)";
  msg.style.color = ok ? "#9cffb0" : "#ffb1b1";
  msg.style.border = ok
    ? "1px solid rgba(0,255,100,.3)"
    : "1px solid rgba(255,0,0,.3)";

  setTimeout(()=>{
    msg.style.display = "none";
  },2500);
}

function generateQR(){
  let url = document.getElementById("urlInput").value.trim();

  if(!url){
    showMessage("❌ Ingresa una URL", false);
    return;
  }

  if(!url.startsWith("http://") && !url.startsWith("https://")){
    url = "https://" + url;
  }

  currentURL = url;

  document.getElementById("urlPreview").textContent = url;

  const qrImage = document.getElementById("qrImage");

  qrImage.src =
    "https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=20&data="
    + encodeURIComponent(url);

  showMessage("✅ QR generado correctamente");
}

function downloadQR(){
  const link = document.createElement("a");
  link.href = document.getElementById("qrImage").src;
  link.download = "parche-ibarna-qr.png";
  link.click();

  showMessage("📥 QR descargado");
}

async function copyURL(){
  await navigator.clipboard.writeText(currentURL);
  showMessage("📋 URL copiada");
}

function printQR(){
  const src = document.getElementById("qrImage").src;

  const w = window.open("");
  w.document.write(`
    <html>
      <body style="margin:0;text-align:center;font-family:Arial;padding-top:40px">
        <img src="${src}" width="350">
        <h2>PARCHE IBARNA</h2>
        <p>Escanea para ver la carta digital</p>
      </body>
    </html>
  `);
  w.document.close();
  w.print();
}

generateQR();
</script>

</body>
</html>
