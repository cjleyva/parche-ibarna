<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Mesas - PARCHE IBARNA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      padding: 40px 20px;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a0a0f, #111827);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
    }

    .logo span {
      color: #00ffff;
    }

    .subtitle {
      color: #9fb3c8;
      font-size: 16px;
    }

    /* Controles */
    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      font-size: 14px;
    }

    .btn-primary {
      background: linear-gradient(95deg, #00ffff, #6effff);
      color: #000;
    }

    .btn-secondary {
      background: rgba(0, 255, 255, 0.1);
      border: 1px solid rgba(0, 255, 255, 0.3);
      color: #00ffff;
    }

    .btn-danger {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff8888;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* Grid de mesas */
    .mesas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .mesa-card {
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s;
    }

    .mesa-card:hover {
      transform: translateY(-5px);
      border-color: rgba(0, 255, 255, 0.5);
      box-shadow: 0 10px 30px rgba(0, 255, 255, 0.1);
    }

    .mesa-numero {
      font-size: 28px;
      font-weight: 800;
      color: #00ffff;
      margin-bottom: 10px;
    }

    .mesa-qr {
      background: white;
      border-radius: 16px;
      padding: 15px;
      margin: 15px 0;
      display: inline-block;
    }

    .mesa-qr svg {
      width: 150px;
      height: 150px;
    }

    .mesa-url {
      font-size: 11px;
      color: #8ca5ba;
      word-break: break-all;
      background: #0f172a;
      padding: 8px;
      border-radius: 8px;
      margin: 10px 0;
    }

    .mesa-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* Acciones generales */
    .acciones-generales {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 40px;
      background: rgba(0, 255, 100, 0.9);
      color: #000;
      font-weight: 600;
      display: none;
      z-index: 1000;
    }

    @media (max-width: 768px) {
      .mesas-grid {
        grid-template-columns: 1fr;
      }
      
      .mesa-qr svg {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">PARCHE <span>IBARNA</span></div>
    <div class="subtitle">Códigos QR por Mesa - Imprimir y colocar en cada mesa</div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" onclick="generarTodasLasMesas()">
      <i class="fas fa-qrcode"></i> Generar QR para todas las mesas
    </button>
    <button class="btn btn-secondary" onclick="imprimirTodo()">
      <i class="fas fa-print"></i> Imprimir todos los QR
    </button>
    <button class="btn btn-secondary" onclick="descargarZip()">
      <i class="fas fa-download"></i> Descargar todos (ZIP)
    </button>
  </div>

  <div id="mesasGrid" class="mesas-grid"></div>

  <div class="acciones-generales">
    <button class="btn btn-secondary" onclick="limpiarMesas()">
      <i class="fas fa-trash-alt"></i> Limpiar todo
    </button>
  </div>
</div>

<div id="message" class="message"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
  // Configuración de mesas
  const NUMERO_MESAS = 12; // Mesas del 1 al 12
  const BASE_URL = window.location.origin + window.location.pathname.replace('qr-mesas.html', 'ordenes.html');

  function showMessage(text, isError = false) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.style.background = isError ? 'rgba(255, 68, 68, 0.9)' : 'rgba(0, 255, 100, 0.9)';
    msg.style.color = isError ? '#fff' : '#000';
    msg.style.display = 'block';
    setTimeout(() => {
      msg.style.display = 'none';
    }, 3000);
  }

  function generarQR(url, size = 150) {
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    return qr.createSvgTag({
      scalable: true,
      margin: 2,
      cellSize: 4
    });
  }

  function obtenerURLMesa(mesaNumero) {
    return `${BASE_URL}?mesa=${mesaNumero}`;
  }

  function generarTarjetaMesa(mesaNumero) {
    const url = obtenerURLMesa(mesaNumero);
    const qrSvg = generarQR(url, 150);
    
    return `
      <div class="mesa-card" id="mesa-${mesaNumero}">
        <div class="mesa-numero">MESA ${mesaNumero}</div>
        <div class="mesa-qr" id="qr-${mesaNumero}">
          ${qrSvg}
        </div>
        <div class="mesa-url">
          <i class="fas fa-link"></i> ${url}
        </div>
        <div class="mesa-buttons">
          <button class="btn btn-sm btn-secondary" onclick="descargarQRMesa(${mesaNumero})">
            <i class="fas fa-download"></i> QR
          </button>
          <button class="btn btn-sm btn-secondary" onclick="imprimirMesa(${mesaNumero})">
            <i class="fas fa-print"></i> Imprimir
          </button>
        </div>
      </div>
    `;
  }

  function generarTodasLasMesas() {
    const grid = document.getElementById('mesasGrid');
    let html = '';
    for (let i = 1; i <= NUMERO_MESAS; i++) {
      html += generarTarjetaMesa(i);
    }
    grid.innerHTML = html;
    showMessage(`✅ Generados ${NUMERO_MESAS} códigos QR para todas las mesas`);
    
    // Guardar en localStorage
    const mesas = [];
    for (let i = 1; i <= NUMERO_MESAS; i++) {
      mesas.push({ numero: i, url: obtenerURLMesa(i) });
    }
    localStorage.setItem('mesasQR', JSON.stringify(mesas));
  }

  function descargarQRMesa(mesaNumero) {
    const qrDiv = document.getElementById(`qr-${mesaNumero}`);
    const svg = qrDiv.querySelector('svg');
    if (!svg) return;
    
    const data = new XMLSerializer().serializeToString(svg);
    const blob = new Blob([data], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mesa-${mesaNumero}-qr.svg`;
    a.click();
    URL.revokeObjectURL(url);
    showMessage(`📥 QR de Mesa ${mesaNumero} descargado`);
  }

  function imprimirMesa(mesaNumero) {
    const mesaCard = document.getElementById(`mesa-${mesaNumero}`).cloneNode(true);
    const ventana = window.open('', '_blank');
    ventana.document.write(`
      <html>
        <head>
          <title>Mesa ${mesaNumero} - PARCHE IBARNA</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              display: flex;
              justify-content: center;
              align-items: center;
              min-height: 100vh;
              margin: 0;
              padding: 20px;
              background: white;
            }
            .qr-container {
              text-align: center;
              border: 2px solid #00ffff;
              border-radius: 20px;
              padding: 30px;
              width: 300px;
            }
            .qr-container svg {
              width: 200px;
              height: 200px;
            }
            .qr-container h1 {
              color: #00ffff;
              margin-bottom: 20px;
            }
            .qr-container p {
              color: #333;
              margin-top: 20px;
            }
          </style>
        </head>
        <body>
          <div class="qr-container">
            <h1>MESA ${mesaNumero}</h1>
            ${mesaCard.querySelector('.mesa-qr').innerHTML}
            <p>Escanea este código QR para ver la carta y hacer tu pedido</p>
            <p><strong>PARCHE IBARNA</strong><br>Poblado Campestre</p>
          </div>
        </body>
      </html>
    `);
    ventana.document.close();
    ventana.print();
  }

  function imprimirTodo() {
    for (let i = 1; i <= NUMERO_MESAS; i++) {
      setTimeout(() => imprimirMesa(i), i * 500);
    }
    showMessage(`🖨️ Preparando impresión de ${NUMERO_MESAS} mesas...`);
  }

  async function descargarZip() {
    const zip = new JSZip();
    const folder = zip.folder("QR-Mesas-PARCHE-IBARNA");
    
    for (let i = 1; i <= NUMERO_MESAS; i++) {
      const qrDiv = document.getElementById(`qr-${i}`);
      if (qrDiv) {
        const svg = qrDiv.querySelector('svg');
        if (svg) {
          const data = new XMLSerializer().serializeToString(svg);
          folder.file(`mesa-${i}-qr.svg`, data);
        }
      }
    }
    
    const content = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = "qr-mesas-parche-ibarna.zip";
    a.click();
    URL.revokeObjectURL(url);
    showMessage(`📦 ZIP descargado con ${NUMERO_MESAS} códigos QR`);
  }

  function limpiarMesas() {
    if (confirm('¿Estás seguro de limpiar todas las mesas?')) {
      document.getElementById('mesasGrid').innerHTML = '';
      localStorage.removeItem('mesasQR');
      showMessage('🗑️ Todas las mesas han sido limpiadas');
    }
  }

  // Cargar mesas guardadas al iniciar
  function cargarMesasGuardadas() {
    const mesasGuardadas = localStorage.getItem('mesasQR');
    if (mesasGuardadas) {
      const mesas = JSON.parse(mesasGuardadas);
      const grid = document.getElementById('mesasGrid');
      let html = '';
      mesas.forEach(mesa => {
        const qrSvg = generarQR(mesa.url, 150);
        html += `
          <div class="mesa-card" id="mesa-${mesa.numero}">
            <div class="mesa-numero">MESA ${mesa.numero}</div>
            <div class="mesa-qr" id="qr-${mesa.numero}">
              ${qrSvg}
            </div>
            <div class="mesa-url">
              <i class="fas fa-link"></i> ${mesa.url}
            </div>
            <div class="mesa-buttons">
              <button class="btn btn-sm btn-secondary" onclick="descargarQRMesa(${mesa.numero})">
                <i class="fas fa-download"></i> QR
              </button>
              <button class="btn btn-sm btn-secondary" onclick="imprimirMesa(${mesa.numero})">
                <i class="fas fa-print"></i> Imprimir
              </button>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
      showMessage(`📱 Cargadas ${mesas.length} mesas guardadas`);
    } else {
      generarTodasLasMesas();
    }
  }

  cargarMesasGuardadas();
</script>
</body>
</html>
