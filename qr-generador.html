<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador QR - Carta PARCHE IBARNA</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:linear-gradient(135deg,#0a0a0f 0%,#0f0f1a 100%);
      font-family:Arial,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .qr-generator{
      background:rgba(10,20,30,.95);
      border:1px solid rgba(0,255,255,.25);
      border-radius:30px;
      padding:35px;
      max-width:600px;
      width:100%;
      text-align:center;
      box-shadow:0 20px 50px rgba(0,0,0,.45);
    }

    .logo{
      font-size:32px;
      font-weight:800;
      color:#fff;
      margin-bottom:8px;
    }

    .logo span{
      color:#00ffff;
      font-weight:300;
    }

    .subtitle{
      color:#9db7c9;
      font-size:14px;
      margin-bottom:30px;
    }

    .url-input-group{
      display:flex;
      gap:10px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }

    .url-input-group input{
      flex:1;
      min-width:250px;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#111827;
      color:white;
      outline:none;
      font-size:14px;
    }

    .url-input-group button{
      padding:14px 20px;
      border:none;
      border-radius:10px;
      background:linear-gradient(95deg,#00ffff,#6effff);
      cursor:pointer;
      font-weight:bold;
    }

    .url-preview{
      background:#111827;
      color:#9db7c9;
      border-radius:10px;
      padding:12px;
      font-size:12px;
      word-break:break-all;
      margin-bottom:25px;
    }

    .qr-box{
      background:white;
      padding:25px;
      border-radius:25px;
      display:inline-block;
      margin-bottom:25px;
      box-shadow:0 0 30px rgba(0,255,255,.25);
    }

    .btn-group{
      display:flex;
      gap:15px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:15px;
    }

    .btn{
      padding:14px 24px;
      border:none;
      border-radius:40px;
      cursor:pointer;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:8px;
      transition:.3s;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn-primary{
      background:linear-gradient(95deg,#00ffff,#6effff);
      color:black;
    }

    .btn-outline{
      background:transparent;
      border:1px solid rgba(0,255,255,.35);
      color:#6effff;
    }

    .success-msg{
      margin-top:20px;
      padding:12px;
      border-radius:10px;
      display:none;
      font-size:13px;
    }

    @media(max-width:600px){
      .url-input-group{
        flex-direction:column;
      }

      .btn-group{
        flex-direction:column;
      }

      .btn{
        justify-content:center;
      }
    }
  </style>
</head>
<body>

<div class="qr-generator">

  <div class="logo">PARCHE <span>IBARNA</span></div>
  <div class="subtitle">Genera el código QR para la carta digital</div>

  <div class="url-input-group">
    <input
      type="text"
      id="urlInput"
      value="https://cjleyva.github.io/parche-ibarna/menu.html"
      placeholder="Ingresa URL">
    <button id="updateQRBtn">Actualizar</button>
  </div>

  <div class="url-preview" id="urlPreview"></div>

  <div class="qr-box">
    <div id="qrCode"></div>
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" id="downloadBtn">
      <i class="fa-solid fa-download"></i> Descargar QR
    </button>

    <button class="btn btn-outline" id="printBtn">
      <i class="fa-solid fa-print"></i> Imprimir
    </button>

    <button class="btn btn-outline" id="copyUrlBtn">
      <i class="fa-solid fa-copy"></i> Copiar URL
    </button>
  </div>

  <div id="successMsg" class="success-msg"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
let currentUrl = "";
const qrContainer = document.getElementById("qrCode");
const urlInput = document.getElementById("urlInput");
const urlPreview = document.getElementById("urlPreview");
const successMsg = document.getElementById("successMsg");

function showMessage(msg, ok=true){
  successMsg.style.display = "block";
  successMsg.innerHTML = msg;
  successMsg.style.background = ok
    ? "rgba(0,255,100,.15)"
    : "rgba(255,0,0,.15)";
  successMsg.style.color = ok ? "#8fffaa" : "#ffaaaa";
  successMsg.style.border = ok
    ? "1px solid rgba(0,255,100,.4)"
    : "1px solid rgba(255,0,0,.4)";

  setTimeout(()=>{
    successMsg.style.display = "none";
  },2500);
}

function generateQR(url){
  if(!url){
    showMessage("❌ URL inválida", false);
    return;
  }

  if(!url.startsWith("http://") && !url.startsWith("https://")){
    url = "https://" + url;
  }

  qrContainer.innerHTML = "";

  new QRCode(qrContainer,{
    text:url,
    width:320,
    height:320,
    colorDark:"#000000",     // negro = mejor lectura
    colorLight:"#ffffff",
    correctLevel:QRCode.CorrectLevel.M
  });

  currentUrl = url;
  urlPreview.innerText = url;

  showMessage("✅ QR generado correctamente");
}

function downloadQR(){
  const canvas = qrContainer.querySelector("canvas");

  if(!canvas){
    showMessage("❌ No hay QR", false);
    return;
  }

  const link = document.createElement("a");
  link.download = "parche-ibarna-qr.png";
  link.href = canvas.toDataURL("image/png");
  link.click();

  showMessage("📥 Descargado");
}

function printQR(){
  const canvas = qrContainer.querySelector("canvas");
  if(!canvas) return;

  const win = window.open("");
  win.document.write(`
    <html>
    <body style="text-align:center;font-family:Arial;padding-top:50px">
      <img src="${canvas.toDataURL()}" width="350">
      <h2>PARCHE IBARNA</h2>
      <p>Escanea para ver la carta digital</p>
    </body>
    </html>
  `);
  win.document.close();
  win.print();
}

async function copyUrl(){
  await navigator.clipboard.writeText(currentUrl);
  showMessage("📋 URL copiada");
}

document.getElementById("updateQRBtn").onclick=()=>generateQR(urlInput.value.trim());
document.getElementById("downloadBtn").onclick=downloadQR;
document.getElementById("printBtn").onclick=printQR;
document.getElementById("copyUrlBtn").onclick=copyUrl;

urlInput.addEventListener("keypress",e=>{
  if(e.key==="Enter"){
    generateQR(urlInput.value.trim());
  }
});

// inicial
generateQR(urlInput.value);
</script>

</body>
</html>
